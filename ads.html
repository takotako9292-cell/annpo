<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>避難所運営シミュレーション</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-orange: #fbbf24;
            --accent-red: #f87171;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 1100px;
            height: 96vh;
            display: grid;
            grid-template-columns: 320px 1fr;
            grid-template-rows: 50px 110px 1fr 220px;
            gap: 10px;
        }
        header {
            grid-column: 1 / -1;
            grid-row: 1;
            background: var(--panel-bg);
            padding: 0 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        header h1 {
            margin: 0;
            font-size: 15px;
            letter-spacing: 0.5px;
            color: #f8fafc;
        }
        .visual-panel {
            grid-column: 1;
            grid-row: 2;
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .visual-art {
            font-size: 30px;
            margin-bottom: 2px;
        }
        .visual-caption {
            font-size: 10.5px;
            color: var(--accent-orange);
            background: rgba(251, 191, 36, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(251, 191, 36, 0.3);
            font-weight: bold;
            text-align: center;
        }
        .status-panel {
            grid-column: 1;
            grid-row: 3 / span 2;
            background: var(--panel-bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            overflow-y: auto;
        }
        .chat-panel {
            grid-column: 2;
            grid-row: 2 / span 2;
            background: var(--panel-bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        .metrics-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #090d16;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        .metric-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .metric-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
        }
        .metric-name {
            color: var(--text-muted);
        }
        .metric-val {
            color: #fff;
        }
        .bar-container {
            background: #1e293b;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.4s ease, background-color 0.4s ease;
        }
        canvas {
            background: #090d16;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            width: 100%;
            height: 65px;
        }
        .log-area {
            flex-grow: 1;
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 13px;
            line-height: 1.6;
        }
        .log-item {
            padding: 10px 14px;
            border-radius: 6px;
            animation: fadeIn 0.3s ease;
            white-space: pre-wrap;
        }
        .log-gm {
            background: rgba(56, 189, 248, 0.08);
            border-left: 4px solid var(--accent-blue);
            color: #e2e8f0;
        }
        .log-incident {
            background: rgba(251, 191, 36, 0.08);
            border-left: 4px solid var(--accent-orange);
            color: #fef08a;
        }
        .log-player {
            background: rgba(52, 211, 153, 0.08);
            border-left: 4px solid var(--accent-green);
            margin-left: 10px;
            color: #a7f3d0;
        }
        .choices-area {
            grid-column: 2;
            grid-row: 4;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            overflow-y: auto;
            background: #111827;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            align-content: start;
        }
        .choice-btn {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: #cbd5e1;
            padding: 9px 11px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11.5px;
            text-align: left;
            transition: all 0.2s;
            line-height: 1.4;
        }
        .choice-btn:hover {
            background: var(--accent-orange);
            color: #0f172a;
            border-color: var(--accent-orange);
            font-weight: bold;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>避難所運営シミュレーション</h1>
        <div id="role-display" style="font-size:12px; color:var(--accent-orange); font-weight:bold;">ターン: 1 / 5</div>
    </header>

    <div class="visual-panel">
        <div class="visual-art" id="visualArt">🏫⚡</div>
        <div class="visual-caption" id="visualCaption">避難所の開設と初期対応</div>
    </div>

    <div class="status-panel">
        <div style="font-size:12px; font-weight:bold; border-bottom:1px solid var(--border-color); padding-bottom:4px; color:#f8fafc; display:flex; justify-content:space-between;">
            <span>運営リソース状況</span>
            <span style="font-size:9.5px; color:var(--accent-red);">HARD-MODE</span>
        </div>
        
        <div class="metrics-grid">
            <div class="metric-row">
                <div class="metric-info">
                    <span class="metric-name">💧 給水・生活用水</span>
                    <span class="metric-val" id="text-water">100%</span>
                </div>
                <div class="bar-container">
                    <div id="fill-water" class="bar-fill" style="width: 100%; background: var(--accent-blue);"></div>
                </div>
            </div>
            <div class="metric-row">
                <div class="metric-info">
                    <span class="metric-name">📦 非常食・物資備蓄</span>
                    <span class="metric-val" id="text-food">100%</span>
                </div>
                <div class="bar-container">
                    <div id="fill-food" class="bar-fill" style="width: 100%; background: var(--accent-green);"></div>
                </div>
            </div>
            <div class="metric-row">
                <div class="metric-info">
                    <span class="metric-name">⚡ 住民の不安・不満度</span>
                    <span class="metric-val" id="text-tension">30%</span>
                </div>
                <div class="bar-container">
                    <div id="fill-tension" class="bar-fill" style="width: 30%; background: var(--accent-orange);"></div>
                </div>
            </div>
        </div>

        <div>
            <div style="font-size:11px; color:var(--text-muted); margin-bottom:3px; font-weight:bold;">現在地: <span id="loc-display" style="color:var(--accent-blue);">受付・本部スペース</span></div>
            <canvas id="mapCanvas" width="280" height="65"></canvas>
        </div>
    </div>

    <div class="chat-panel">
        <div id="logArea" class="log-area">
            <div class="log-item log-gm">
                <strong>[運営本部アナウンス]</strong><br>
                大地震発生に伴い、臨時避難所が開設されました。<br>
                あなたは運営責任者として、この過酷な避難所を5日間（5ターン）守り抜かなければなりません。<br>
                次々と発生する予測不能なトラブルに対し、的確な判断を下してください。<br><br>
                まずは、あなたの**「立場（バックグラウンド）」**を下の10個から選んでください。
            </div>
        </div>
    </div>

    <div class="choices-area" id="choicesArea"></div>
</div>

<script>
    let gameState = {
        turn: 1,
        maxTurns: 5,
        role: null,
        water: 100,
        food: 100,
        tension: 30,
        location: "受付・本部スペース",
        isFinished: false,
        currentIncident: null,
        usedIncidentIds: []
    };

    const canvas = document.getElementById("mapCanvas");
    const ctx = canvas.getContext("2d");

    function drawMap() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#334155";
        ctx.lineWidth = 1.5;
        
        ctx.strokeRect(10, 6, 75, 52);
        ctx.fillStyle = gameState.location === "備蓄倉庫" ? "#1e293b" : "#090d16"; 
        ctx.fillRect(10, 6, 75, 52);
        ctx.fillStyle = gameState.location === "備蓄倉庫" ? "#38bdf8" : "#64748b"; 
        ctx.font = "10.5px sans-serif"; ctx.fillText("備蓄倉庫", 22, 37);

        ctx.strokeRect(95, 6, 90, 52);
        ctx.fillStyle = gameState.location === "受付・本部スペース" ? "#1e293b" : "#090d16"; 
        ctx.fillRect(95, 6, 90, 52);
        ctx.fillStyle = gameState.location === "受付・本部スペース" ? "#38bdf8" : "#64748b"; 
        ctx.fillText("受付・本部", 112, 37);

        ctx.strokeRect(195, 6, 75, 52);
        ctx.fillStyle = gameState.location === "居住スペース" ? "#1e293b" : "#090d16"; 
        ctx.fillRect(195, 6, 75, 52);
        ctx.fillStyle = gameState.location === "居住スペース" ? "#38bdf8" : "#64748b"; 
        ctx.fillText("居住フロア", 207, 37);

        ctx.fillStyle = "#fbbf24";
        ctx.beginPath();
        let dotX = 140;
        if(gameState.location === "備蓄倉庫") dotX = 47;
        if(gameState.location === "居住スペース") dotX = 232;
        ctx.arc(dotX, 16, 3.5, 0, Math.PI * 2); 
        ctx.fill();
    }
    drawMap();

    function updateVisual(art, caption) {
        if(art) document.getElementById("visualArt").innerText = art;
        if(caption) document.getElementById("visualCaption").innerText = caption;
    }

    function updateStatus() {
        document.getElementById("text-water").innerText = gameState.water + "%";
        const fillWater = document.getElementById("fill-water");
        fillWater.style.width = gameState.water + "%";
        fillWater.style.background = gameState.water <= 30 ? "var(--accent-red)" : "var(--accent-blue)";

        document.getElementById("text-food").innerText = gameState.food + "%";
        const fillFood = document.getElementById("fill-food");
        fillFood.style.width = gameState.food + "%";
        fillFood.style.background = gameState.food <= 30 ? "var(--accent-red)" : "var(--accent-green)";

        document.getElementById("text-tension").innerText = gameState.tension + "%";
        const fillTension = document.getElementById("fill-tension");
        fillTension.style.width = gameState.tension + "%";
        fillTension.style.background = gameState.tension >= 70 ? "var(--accent-red)" : "var(--accent-orange)";

        document.getElementById("loc-display").innerText = gameState.location;
        
        if (!gameState.isFinished) {
            document.getElementById("role-display").innerText = `ターン: ${gameState.turn} / ${gameState.maxTurns}`;
        }
        drawMap();
    }
    updateStatus();

    function addLog(sender, text, type = "gm") {
        const logArea = document.getElementById("logArea");
        const div = document.createElement("div");
        div.className = `log-item log-${type}`;
        div.innerHTML = `<strong>[${sender}]</strong><br>${text}`;
        logArea.appendChild(div);
        logArea.scrollTop = logArea.scrollHeight;
    }

    const initialRolePool = [
        "学校関係者（生徒や保護者のケアを最優先する）",
        "自治会役員（古参住民の秩序やルール厳守を貫く）",
        "保健師・医療職（要介護者・持病持ちを救う医療優先）",
        "一般ボランティア（若者や外部者の権利を主張する）",
        "避難者代表（住民の不満を運営に直撃させる）",
        "防災担当職員（行政の規定通りに冷徹・平等を貫く）",
        "施設管理人（設備の保全とこれ以上の破損を防ぐ）",
        "近隣商店主（余剰物資の公平配分と買い占め防止）",
        "子育て世代代表（乳幼児の衛生とミルク確保を訴える）",
        "無所属の調停役（すべての派閥の間に入り妥協点を探る）",
        "避難所近くの寺の住職（精神的な支えと対話による解決を重視）",
        "元消防団員（機動力と迅速な救助・安全確保を最優先）"
    ];

    const incidentsDatabase = [
        {
            id: "water_leak",
            title: "【インシデント】給水管が破損し、大規模な水漏れが発生！",
            desc: "余震で給水配管が破裂。貴重な生活用水が猛烈な勢いで流失し、このままでは数時間で水が枯渇します。",
            art: "💧💥",
            actions: [
                { text: "元栓を直ちに閉めて業者を手配する", w: -15, f: 0, t: +5, story: "元栓を急ぎ閉めて業者を手配。水は失われましたが致命傷を免れました。", clearEnd: "【クリア：迅速な止水処理】給水インフラを守り抜いたあなたの判断は高く評価されました！", failEnd: "【ゲームオーバー：水資源枯渇】給水トラブルの対応に遅れ、生命維持の源が断たれました。" },
                { text: "住民にバケツを持ってきてもらい、漏れた水を総出で回収する", w: -5, f: -5, t: +10, story: "住民が泥だらけになって水を回収。労力はかかりましたが水を大幅に節約できました。", clearEnd: "【クリア：泥まみれの連帯】住民総出のバケツリレーで危機を乗り切り、強い絆が生まれました！", failEnd: "【ゲームオーバー：労力疲弊と内紛】回収作業を巡る揉め事から不満が沸騰し組織が崩壊しました。" },
                { text: "ペットボトルや鍋をかき集め、一滴残らず受け皿に溜める", w: -8, f: -3, t: +8, story: "館内の容器総動員で水を確保。慌ただしかったですが実用的な備蓄が増えました。", clearEnd: "【クリア：機転の生活水確保】あり合わせの容器を活用したサバイバル術が功を奏しました！", failEnd: "【ゲームオーバー：衛生汚染】集めた容器の不衛生さからトラブルが続発し閉鎖されました。" },
                { text: "壊れた箇所を自前の防水テープとゴム板で強引に塞ぐ", w: -10, f: -2, t: +12, story: "応急処置が成功し水漏れが停止。技術力のある住民に賞賛が集まりました。", clearEnd: "【クリア：職人技のインフラ防衛】住民のDIY技術を活かした見事な応急処置で配管を完治させました！", failEnd: "【ゲームオーバー：決壊パニック】強引なテープ補強が水圧に耐え切れず大爆発を起こしました。" },
                { text: "隣接するプールの底水を浄化して生活用水に回すルートを作る", w: -5, f: -10, t: +15, story: "プール水の汲み上げに苦労しましたが、当面の水不足は完全に解消されました。", clearEnd: "【クリア：プール水大作戦】機転を利かせてプールの水を生活水に転換し完走しました！", failEnd: "【ゲームオーバー：集団腹痛の悪夢】浄化不十分なプール水を配給してしまい全員が倒れました。" },
                { text: "修理を後回しにして、まずは残りの安全な水をタンクに移し替える", w: -12, f: 0, t: +15, story: "周囲が水浸しになり苦情は出ましたが、綺麗な水自体のキープには成功しました。", clearEnd: "【クリア：水ファーストの生存哲学】水分確保を最優先し、合理的な判断で生き残りました。", failEnd: "【ゲームオーバー：床下の水没】放置された水漏れが電気系統をショートさせ暗闇に包まれました。" },
                { text: "外部の給水車が来るまで「自然に止まるのを待つ」と様子見する", w: -35, f: 0, t: +25, story: "放置した結果、水が完全に枯渇し、館内で大パニックが勃発しました。", clearEnd: "【クリア：奇跡の逃げ切り】ギリギリのタイミングで給水車が到着。冷や汗のクリアです！", failEnd: "【ゲームオーバー：完全な人災】完全な事なかれ主義が仇となり、水が完全消滅しました。" },
                { text: "「水の使用を一切禁止する！」と全館に厳しい断水令を出す", w: 0, f: 0, t: +30, story: "衛生面と喉の渇きから住民の怒りが爆発。暴動寸前になりました。", clearEnd: "【クリア：恐怖の独裁管理】強権的な断水令で水は死守したものの、重い代償を残しました。", failEnd: "【ゲームオーバー：武装蜂起】過度な水制限に耐えかねた住民たちが暴徒化しました。" },
                { text: "配管のバルブを切り替え、トイレ用として汚れた水を無理やり使う", w: -10, f: -5, t: +20, story: "悪臭と使い勝手の悪さに不満が噴出しましたが、配管の破損被害は防ぎました。", clearEnd: "【クリア：悪臭を耐え抜いたサバイバル】衛生環境の悪化に目を瞑りライフラインを守り切りました。", failEnd: "【ゲームオーバー：悪臭テロ】耐えがたい悪臭が充満し、住民たちが次々と逃げ出しました。" },
                { text: "「業者に来てもらうまで我慢しろ」と開き直って何もしない", w: -40, f: 0, t: +35, story: "対応の遅さに激昂した住民が本部になだれ込み、管理責任を厳しく追及されました。", clearEnd: "【クリア：泥沼の生還】怒号を浴び続けながらも、タイムアップの笛が鳴り響き生き残りました。", failEnd: "【ゲームオーバー：完全崩壊】責任者の怠慢により組織の信頼が失墜しました。" }
            ]
        },
        {
            id: "overflow_refugees",
            title: "【インシデント】行き場を失った大量の避難者が殺到！",
            desc: "近隣の避難所が土砂崩れで閉鎖され、行き場を失った200人以上の被災者が「中に入らせろ」と門を叩いています。",
            art: "👥🚪",
            actions: [
                { text: "定員オーバーを覚悟して、廊下や体育館の隙間に全員を受け入れる", w: -15, f: -20, t: -5, story: "足の踏み場もなくなりましたが、命を救ったことで深い連帯感が生まれました。", clearEnd: "【クリア：慈悲の精神による大団円】全員を救済したあなたの心意気は地域全体の伝説となりました！", failEnd: "【ゲームオーバー：酸欠パニック】すし詰め状態で空気環境が悪化しパニックが発生しました。" },

    function getRandomSubarray(arr, size) {
        let shuffled = arr.slice(0);
        let i = arr.length;
        let min = i - size;
        while (i-- > min) {
            let index = Math.floor((i + 1) * Math.random());
            let temp = shuffled[index];
            shuffled[index] = shuffled[i];
            shuffled[i] = temp;
        }
        return shuffled.slice(min);
    }

    function renderChoices() {
        const choicesArea = document.getElementById("choicesArea");
        choicesArea.innerHTML = "";

        if (gameState.role === null) {
            updateVisual("🏫⚡", "避難所の開設と初期対応");
            addLog("運営本部", "運営責任者として、以下の10個の立場候補からあなたのバックグラウンドを選択してください。", "incident");
            
            let currentRoles = getRandomSubarray(initialRolePool, 10);
            currentRoles.forEach((roleText, idx) => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerText = `${idx + 1}. ${roleText}`;
                btn.onclick = () => handleRoleChoice(roleText);
                choicesArea.appendChild(btn);
            });
        } else {
            // まだ使っていないインシデントを優先して完全ランダム抽出
            let availableIncidents = incidentsDatabase.filter(inc => !gameState.usedIncidentIds.includes(inc.id));
            if (availableIncidents.length === 0) {
                gameState.usedIncidentIds = [];
                availableIncidents = incidentsDatabase;
            }
            let incident = availableIncidents[Math.floor(Math.random() * availableIncidents.length)];
            gameState.usedIncidentIds.push(incident.id);
            gameState.currentIncident = incident;

            updateVisual(incident.art, incident.title);
            addLog("突発インシデント発生", `${incident.title}<br>${incident.desc}`, "incident");

            // 10択の選択肢を毎回シャッフルして並びを完全にランダム化
            let shuffledActions = getRandomSubarray(incident.actions, incident.actions.length);
            gameState.currentIncident.shuffledActions = shuffledActions;

            shuffledActions.forEach((act, idx) => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerText = `${idx + 1}. ➡ ${act.text}`;
                btn.onclick = () => handleActionChoice(act);
                choicesArea.appendChild(btn);
            });
        }
    }

    renderChoices();

    function handleRoleChoice(roleText) {
        gameState.role = roleText;
        addLog("あなた", `「${roleText}」として運営を引き受けました。`, "player");
        addLog("運営本部", `「${roleText.split('（')[0]}」の方針のもと、避難所運営がスタートしました。混乱を乗り切ってください！`, "gm");
        
        let locs = ["受付・本部スペース", "備蓄倉庫", "居住フロア"];
        gameState.location = locs[Math.floor(Math.random() * locs.length)];
        updateStatus();
        renderChoices();
    }

    function handleActionChoice(act) {
        if (gameState.isFinished) return;

        addLog("あなたの判断", `[${gameState.currentIncident.title}]<br>➡ ${act.text}`, "player");

        gameState.turn++;
        gameState.water = Math.max(0, gameState.water + act.w);
        gameState.food = Math.max(0, gameState.food + act.f);
        gameState.tension = Math.min(100, gameState.tension + act.t);

        let locs = ["受付・本部スペース", "備蓄倉庫", "居住フロア"];
        gameState.location = locs[Math.floor(Math.random() * locs.length)];

        let changeDesc = [];
        if(act.w !== 0) changeDesc.push(`水 ${act.w > 0 ? '+' + act.w : act.w}%`);
        if(act.f !== 0) changeDesc.push(`物資 ${act.f > 0 ? '+' + act.f : act.f}%`);
        if(act.t !== 0) changeDesc.push(`不満度 ${act.t > 0 ? '+' + act.t : act.t}%`);

        addLog("対応結果レポート", `${act.story}<br><br>📊 状況変化：${changeDesc.join(' / ')}`, "gm");

        updateStatus();

        if (gameState.water <= 0 || gameState.food <= 0 || gameState.tension >= 100) {
            gameState.isFinished = true;
            document.getElementById("role-display").innerText = "【運営崩壊】";
            document.getElementById("choicesArea").innerHTML = '<div style="grid-column:1/-1; text-align:center; font-weight:bold; color:var(--accent-red); padding:10px;">❌ リソースの枯渇か住民の不満爆発により、避難所は機能停止しました。</div>';
            addLog("【結末】", act.failEnd, "gm");
        } else if (gameState.turn > gameState.maxTurns) {
            gameState.isFinished = true;
            document.getElementById("role-display").innerText = "【運営クリア】";
            document.getElementById("choicesArea").innerHTML = '<div style="grid-column:1/-1; text-align:center; font-weight:bold; color:var(--accent-green); padding:10px;">🎉 5日間の過酷な避難所運営を無事に完遂しました！</div>';
            addLog("【結末】", act.clearEnd, "gm");
        } else {
            renderChoices();
        }
    }
</script>
